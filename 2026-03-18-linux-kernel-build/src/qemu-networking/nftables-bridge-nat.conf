table inet nat {
    
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip saddr 10.0.0.0/24 oifname "wlan0" masquerade
    }
    
    chain forward {
        type filter hook forward priority 0; policy drop;
        # Internet -> VM
        ct state related,established accept
        # VM -> Internet
        iifname "br-qemu" oifname "wlan0" accept
    }
}
